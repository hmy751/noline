services:
  postgres-test:
    image: postgres:14-alpine
    ports:
      - '55432:5432'
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: noline_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d noline_test']
      interval: 1s
      timeout: 3s
      retries: 30
