    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      h1 {
        font-size: 32px;
        margin-bottom: 10px;
        color: #166534;
      }

        margin: 30px 0 15px;

  <body>
    <h1>Noline</h1>
    <p class="tagline">네트워크가 없어도 여행은 계속된다</p>

    <div class="section">
      <p>Noline은 오프라인에서도 완벽하게 작동하는 여행 관리 앱입니다.</p>
    </div>

    <h2>주요 기능</h2>
    <div class="section">
      <ul>
        <li><strong>오프라인 지도</strong> - 데이터 없이도 지도 확인 가능</li>
        <li><strong>일정 관리</strong> - 날짜별 여행 일정 계획</li>
        <li><strong>경비 관리</strong> - 다중 통화 지원</li>
        <li><strong>자동 동기화</strong> - 온라인 복귀 시 자동 백업</li>
      </ul>
    </div>
