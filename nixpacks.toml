# Railway Nixpacks Configuration for pnpm monorepo

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
    "pnpm --filter @repo/schema build",
    "pnpm --filter @apps/server build"
]

[start]
cmd = "cd apps/server && pnpm start"
